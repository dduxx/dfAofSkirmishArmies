name: Release

on:
  pull_request:
    branches: [main]
    types: [closed]

jobs:
  release:
    if: github.event.pull_request.merged == true
    permissions:
      contents: write
    uses: dduxx/buildscad-workflows/.github/workflows/release.yml@v2.0.1
    with:
      openscad: openscad-nightly
      artifacts: '[{"filter":"scad/kingdom_of_angels/*","name":"kingdom_of_angels"},{"filter":"scad/saurians/*","name":"saurians"}]'
